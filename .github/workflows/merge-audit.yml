# Merge audit: a tripwire, not a gate. Every change that lands on main is checked after the fact,
# and anything that did not arrive the approved way opens a "security-alert" issue for Blue.
#
#   ALERT  a commit reached main without a merged pull request (direct push or bypass). A commit
#          counts as merged when any PR merged into main includes it, so commits that first went
#          through a stacked PR and then reached main inside another PR do not alert (issue #35).
#   ALERT  a pull request from an agent account merged without Blue's approval
#   ALERT  a pull request was merged by anyone other than Blue
#
# While agents still act through Blue's own GitHub account (before docs/SETUP-GUARDRAILS.md
# step B), GitHub cannot tell an agent from Blue, so only the first check can fire. After step B,
# all three apply. The token can read the repo and open issues; it cannot merge or approve.
# Actions are pinned to full commit SHAs (tag in the trailing comment); app/ci-hygiene.test.js
# fails if a `uses:` line is not.
name: Merge audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # The decision logic lives in .github/scripts/merge-audit.js so `npm test` covers it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HUMAN_APPROVER: ABlueAI
        with:
          script: |
            const { auditPush, githubApi } = require('./.github/scripts/merge-audit.js');
            const human = process.env.HUMAN_APPROVER;
            const { owner, repo } = context.repo;
            const shas = context.payload.commits && context.payload.commits.length
              ? context.payload.commits.map((c) => c.id)
              : [context.sha];
            const problems = await auditPush({ shas, human, api: githubApi(github, { owner, repo }) });
            if (problems.length === 0) { core.info('Merge audit: every change on main arrived through an approved pull request.'); return; }
            const body = [
              `@${human} the merge audit found a change on main that did not arrive the approved way.`,
              '',
              ...problems.map((p) => `- ${p}`),
              '',
              `Push: ${context.payload.compare || context.sha}`,
              'Check docs/SETUP-GUARDRAILS.md. If this was you on purpose, close this issue with a note.',
            ].join('\n');
            const title = 'Security alert: unapproved change on main';
            try { await github.rest.issues.create({ owner, repo, title, body, labels: ['security-alert'] }); }
            catch { await github.rest.issues.create({ owner, repo, title, body }); }
            core.setFailed(problems.join(' '));
